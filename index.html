<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MiraMed | Sonreír con una mirada</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #ffffff, #ffeef3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 400px;
    }
    img {
      width: 100%;
      max-width: 250px;
      margin-bottom: 1rem;
    }
    h1 {
      margin: 0;
      font-size: 1.8rem;
      color: #d32f61;
    }
    p {
      font-size: 1rem;
      color: #555;
      margin-bottom: 2rem;
    }
    a.button {
      background-color: #E1306C;
      color: white;
      padding: 0.9rem 2rem;
      border-radius: 30px;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    a.button:hover {
      background-color: #c1275b;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo_miramed_resized.jpg" alt="MiraMed Logo">
    <h1>@miramed_consultorio</h1>
    <p>Sonreír con una mirada 💖<br>Síguenos para descubrir cómo cuidamos tu salud visual</p>
    <a class="button" href="https://instagram.com/miramed_consultorio" target="_blank">Seguir en Instagram</a>
  </div>

</body>
</html>
